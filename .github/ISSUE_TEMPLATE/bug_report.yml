name: Bug report
description: 报告 dsh-runner-watcher 的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认：`node --test` 与 `node scripts/smoke.mjs` 是否通过。
        如果只有你自己的 runner 出问题，请附上 `dsh-runner-watcher list` 与 `dsh-runner-watcher status` 的输出（可脱敏）。
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统、Node 版本、DSH 版本；runner 是 local / WSL / SSH 哪种
      placeholder: Windows 11 · Node 24.19 · DSH 0.1.5-rc.2 · WSL Ubuntu
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. dsh-runner-watcher discover --transport wsl:Ubuntu
        2. dsh-runner-watcher adopt
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 请贴完整报错，不要只贴最后一行
    validations:
      required: true
  - type: textarea
    id: registry
    attributes:
      label: 注册表与状态输出（可脱敏）
      render: shell
    validations:
      required: false
