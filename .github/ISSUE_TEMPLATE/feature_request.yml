name: Feature request
description: 给 dsh-runner-watcher 提建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景比描述方案更有用
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代做法
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      multiple: true
      options:
        - runner 接入 / 自动关联
        - 采集（transport / systemd / 进程）
        - 日志解析
        - RPS 评分模型
        - 仪表盘 / 图表
        - DSH 工具
        - CLI
        - 文档
