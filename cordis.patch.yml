# dsh-runner-watcher — cordis bundle patch.
#
# Inserts this plugin into the profile's plugin tree. Every config key below is
# optional; the plugin falls back to the defaults documented in README.md.
#
# `dataDir` is intentionally NOT set here: the plugin defaults it to
# `<dsh home>/runner-watcher`, so the patch file stays plain YAML with no
# expression evaluation. Uncomment it to point the state somewhere else.
- insert:
    - id: runner-watcher
      name: dsh-runner-watcher
      config:
        # dataDir: /absolute/path/to/state
        # Discover runners on every collect and link them to the registry.
        autoDiscover: true
        # Park discovered runners as "pending" (false) until you adopt them,
        # or register them straight away (true).
        autoAdopt: false
        # Analysis window for the CLI / dashboard default view.
        windowHours: 168
        # Rolling window (in completed jobs) behind one RPS point.
        rollingWindow: 6
        # Dashboard auto-refresh in seconds; 0 disables the meta refresh.
        refreshSeconds: 0
        # Near-real-time runner status: the server refreshes an in-memory
        # snapshot every N seconds and the dashboard patches it in place
        # (no page reload). 0 disables the background timer.
        liveIntervalSec: 10
        # Ingest finished jobs automatically: the live tick sees a runner go
        # busy -> idle and runs one collection (no discovery). Cooldown keeps
        # a busy fleet from collecting on every tick.
        autoCollectOnIdle: true
        autoCollectCooldownSec: 600
